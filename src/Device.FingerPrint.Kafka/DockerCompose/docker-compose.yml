version: "2"

services:
  zookeeper:
    image: docker.io/bitnami/zookeeper:3.7
    ports:
      - "2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - ./data/zookeeper:/bitnami/zookeeper
    mem_limit: 300m
    memswap_limit: 600m
  kafka-0:
    image: docker.io/bitnami/kafka:3
    ports:
      - '9095:9095'
      - '29095:29095'
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_BROKER_ID=0
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://:29095,EXTERNAL://:9095
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka-0:29095,EXTERNAL://10.18.200.222:9095
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_LOG_RETENTION_HOURS=24
      - KAFKA_CFG_LOG_FLUSH_INTERVAL_MS=3000000
    volumes:
      - ./data/kafka0:/bitnami/kafka
    depends_on:
      - zookeeper
    mem_limit: 2048m
    memswap_limit: 4096m
    mem_reservation: 1024m
  kafka-1:
    image: docker.io/bitnami/kafka:3
    ports:
      - '9096:9096'
      - '29096:29096'
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_BROKER_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://:29096,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka-1:29096,EXTERNAL://10.18.200.222:9096
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_LOG_RETENTION_HOURS=24
      - KAFKA_CFG_LOG_FLUSH_INTERVAL_MS=3000000
    volumes:
      - ./data/kafka1:/bitnami/kafka
    depends_on:
      - zookeeper
    mem_limit: 2048m
    memswap_limit: 4096m
    mem_reservation: 1024m
  kafka-2:
    image: docker.io/bitnami/kafka:3
    ports:
      - '9097:9097'
      - '29097:29097'
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_BROKER_ID=2
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://:29097,EXTERNAL://:9097
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka-2:29097,EXTERNAL://10.18.200.222:9097
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_LOG_RETENTION_HOURS=24
      - KAFKA_CFG_LOG_FLUSH_INTERVAL_MS=3000000
    volumes:
      - ./data/kafka2:/bitnami/kafka
    depends_on:
      - zookeeper
    mem_limit: 2048m
    memswap_limit: 4096m
    mem_reservation: 1024m
  kafka-ui:
    image: 'provectuslabs/kafka-ui:0.3.3'
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-0:29095
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    mem_limit: 300m
    memswap_limit: 600m
    
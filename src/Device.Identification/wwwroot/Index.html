<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>

	<script>
		var isCallbackCalled = false;
		var timeOutMessage = 'Run script timeout!';

		var handleCallback = (errorMessage) => {
			if (isCallbackCalled) return;

			isCallbackCalled = true;
			clearTimeout(fallbackTimer);

			handle_x12Result(errorMessage);
		};

		var fallbackTimer = setTimeout(() => handleCallback(timeOutMessage), 5000);

		window.gfpCallback = window.gfpCallback || {};
		gfpCallback.callback = handleCallback;

		function handle_x12Result(errorMessage) {
			if (errorMessage) {
				// Log error message
				console.error("ErrorMessage:", errorMessage);
			}

			// Do something after FPSReady
			console.log("Run script completed!");
			console.timeEnd("executeScript");
		}
	</script>

    <script src="//localhost:5011/act" async defer></script>
</head>
<body>
    test
</body>
</html>
